<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            background-image: linear-gradient(to right bottom, #051937, #341b47, #601245, #840d32, #942b0e);
        }

        body {
            background-image: linear-gradient(to right bottom, #051937, #113659, #1c557b, #28779d, #379bbe);
        }

        a {
            background-image: linear-gradient(to right bottom, #051937, #2b4562, #56768f, #86aabd, #bce0ec);
        }
    </style>
</head>

<body>

    <DIV class="container-fluid d-flex flex-column" style="min-height: 100vh;">

        <header>
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Navbar</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="#">Em Desenvolvimento</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <section class="mt=5 d-flex flex-column align-items-center">
                <h1 style="color:grey ;">Aplicações desenvolvidas com:</h1>
                <hr style="border-color: #942b0e;">
                <p style="color: whitesmoke;font-family: 'Times New Roman';font-size: 20px;">
                    <img width="96" height="96" src="https://img.icons8.com/sci-fi/96/html-5.png" alt="html-5" />HTML
                    <img width="100" height="100" src="https://img.icons8.com/plasticine/100/css3.png" alt="css3" />CSS3
                    <img width="96" height="96" src="https://img.icons8.com/nolan/96/hollow-knight.png" alt="hollow-knight"/>Hollow Knight
                </p>
                <br>
                <!--Primeiro Card-->
                <div class="card" style="width: 18rem;">
                    <img src="./images/atorP.gif" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Projeto 1</h5>
                        <p class="card-text"></p>
                        <a href="#" class="btn btn-primary">Ir para o Projeto</a>
                    </div>
                </div>
            </section>


        </main>

        <footer></footer>

    </DIV>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
